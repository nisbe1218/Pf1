services:
  redis:
    image: redis:7-alpine
    container_name: medical_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: medical_db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-plateforme_medicale}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nis123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: medical_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - OLLAMA_PREPROCESS_MODEL=qwen2.5:7b-instruct
      - OLLAMA_FALLBACK_MODEL=qwen2.5:7b-instruct
      - OLLAMA_TIMEOUT_SECONDS=1500
      - OLLAMA_PRIMARY_TIMEOUT_SECONDS=1200
      - OLLAMA_FALLBACK_TIMEOUT_SECONDS=1200
      - OLLAMA_NUM_PREDICT=500
      - OLLAMA_RETRY_NUM_PREDICT=500
      - OLLAMA_MIN_PASS2_NUM_PREDICT=300
      - OLLAMA_MAX_COLUMNS=40
      - OLLAMA_PREVIEW_ROWS=2
      - OLLAMA_RETRY_MAX_COLUMNS=20
      - OLLAMA_RETRY_PREVIEW_ROWS=2
      - LLM_MAX_PRIORITY_COLUMNS=25
      - OLLAMA_NUM_CTX=8192
      - MAX_CONTEXT_TOKENS=8192
      - CONTEXT_OUTPUT_TOKENS=1200
      - SYSTEM_PROMPT_TOKENS=800
      - CONTEXT_RETRY_MARGIN=200
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/tmp/preprocess/chroma
      - RAG_MAX_CHUNKS=1
      - LLM_BATCH_SIZE=2
      - PREPROCESS_TIMEOUT_MINUTES=720
      - LLM_MAX_SAMPLE_ROWS=9999
      - OLLAMA_PRIMARY_TIMEOUT_SECONDS=2400
      - OLLAMA_FALLBACK_TIMEOUT_SECONDS=2400
      - OLLAMA_TIMEOUT_SECONDS=2400
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - ollama
      - redis
    restart: unless-stopped

  audit_cleanup:
    build:
      context: ./backend
    container_name: medical_audit_cleanup
    command: sh -c "while true; do python manage.py cleanup_audit_logs --days 15; sleep 86400; done"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    container_name: medical_celery_worker
    command: celery -A config worker -l info -c 1
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - OLLAMA_PREPROCESS_MODEL=qwen2.5:7b-instruct
      - OLLAMA_FALLBACK_MODEL=qwen2.5:7b-instruct
      - OLLAMA_TIMEOUT_SECONDS=2400
      - OLLAMA_PRIMARY_TIMEOUT_SECONDS=2400
      - OLLAMA_FALLBACK_TIMEOUT_SECONDS=2400
      - OLLAMA_NUM_PREDICT=500
      - OLLAMA_RETRY_NUM_PREDICT=500
      - OLLAMA_MIN_PASS2_NUM_PREDICT=300
      - OLLAMA_MAX_COLUMNS=40
      - OLLAMA_PREVIEW_ROWS=2
      - OLLAMA_RETRY_MAX_COLUMNS=20
      - OLLAMA_RETRY_PREVIEW_ROWS=2
      - LLM_MAX_PRIORITY_COLUMNS=25
      - OLLAMA_NUM_CTX=8192
      - MAX_CONTEXT_TOKENS=8192
      - CONTEXT_OUTPUT_TOKENS=1200
      - SYSTEM_PROMPT_TOKENS=800
      - CONTEXT_RETRY_MARGIN=200
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/tmp/preprocess/chroma
      - RAG_MAX_CHUNKS=1
      - LLM_BATCH_SIZE=2
      - LLM_MAX_SAMPLE_ROWS=9999
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical_frontend
    command: sh -c "if [ ! -d build ] || [ ! -f build/index.html ]; then npm run build; fi && npx serve -s build -l 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: medical_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  redis_data:
